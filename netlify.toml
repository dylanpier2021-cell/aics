# NOTE: the live site (www.aicscleaning.com) is served by Vercel, which ignores
# this file. Redirects that must work live go in vercel.json.
# Netlify config for the AICS static site.
# There is no build step: the repo root IS the site.

[build]
  publish = "."
  command = ""

# Clean URLs (/services/window-cleaning-champaign-county/ instead of .../index.html)
[build.processing]
  skip_processing = false

# Long-cache the fingerprint-free static assets, but let HTML revalidate so
# content edits go live immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible security headers for a brochure site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Force the canonical host + https so link equity lands on one URL.
# Uncomment and set the real domain once DNS is pointed.
# [[redirects]]
#   from = "https://allimprovementcleaning.com/*"
#   to = "https://www.allimprovementcleaning.com/:splat"
#   status = 301
#   force = true

# Service pages moved to Champaign County URLs (Nov 2026). Permanent redirects
# keep old links, bookmarks and Google's index pointing at the new pages.
[[redirects]]
  from = "/services/commercial-cleaning"
  to = "/services/commercial-cleaning-champaign-county/"
  status = 301
  force = true

[[redirects]]
  from = "/services/commercial-cleaning/*"
  to = "/services/commercial-cleaning-champaign-county/"
  status = 301
  force = true

